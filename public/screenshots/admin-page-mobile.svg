    <rect x="202" y="290" width="168" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="214" y="315" fill="#334155" font-family="sans-serif" font-size="11" font-weight="bold">PESANAN</text>
