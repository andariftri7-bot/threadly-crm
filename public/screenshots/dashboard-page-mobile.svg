<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
    <rect width="390" height="844" fill="#FAF9F6"/>
    <!-- Safe Area / Header -->
    <rect x="0" y="0" width="390" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="20" y="24" width="28" height="28" rx="8" fill="#5B4BDB"/>
    <text x="56" y="43" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="bold">Threadly</text>
    <rect x="334" y="24" width="36" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="342" y1="33" x2="362" y2="33" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="342" y1="38" x2="362" y2="38" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="342" y1="43" x2="362" y2="43" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- Content Area -->
    <text x="20" y="105" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="bold">Dashboard Toko (Mobile 390px)</text>
    <text x="20" y="125" fill="#334155" font-family="sans-serif" font-size="12">Desain Mobile-First Tanpa Guliran Horizontal</text>

    <!-- Main Mobile Card -->
    <rect x="20" y="145" width="350" height="130" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="36" y="175" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="bold">Ringkasan Kinerja Toko</text>
    <text x="36" y="198" fill="#334155" font-family="sans-serif" font-size="12">Responsif pada viewport 360px - 430px</text>
    <rect x="36" y="220" width="120" height="36" rx="8" fill="#5B4BDB"/>
    <text x="56" y="243" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">Aksi Utama</text>

    <!-- 2 Column Mobile Stat Grid -->
    <rect x="20" y="290" width="168" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="32" y="315" fill="#334155" font-family="sans-serif" font-size="11" font-weight="bold">PELANGGAN</text>
    <text x="32" y="345" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="900">328</text>

    <rect x="202" y="290" width="168" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="214" y="315" fill="#334155" font-family="sans-serif" font-size="11" font-weight="bold">PESANAN</text>
    <text x="214" y="345" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="900">64</text>

    <!-- Mobile Card List Item 1 -->
    <rect x="20" y="395" width="350" height="85" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="36" y="425" fill="#0F172A" font-family="sans-serif" font-size="14" font-weight="bold">Dinda Ayu Putri</text>
    <text x="36" y="445" fill="#334155" font-family="sans-serif" font-size="12">081234567890 - 4 Pesanan</text>
    <rect x="270" y="415" width="85" height="24" rx="12" fill="#D1FAE5"/>
    <text x="285" y="431" fill="#064E3B" font-family="sans-serif" font-size="10" font-weight="bold">LANGGANAN</text>

    <!-- Mobile Card List Item 2 -->
    <rect x="20" y="495" width="350" height="85" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="36" y="525" fill="#0F172A" font-family="sans-serif" font-size="14" font-weight="bold">Budi Santoso</text>
    <text x="36" y="545" fill="#334155" font-family="sans-serif" font-size="12">082198765432 - 1 Pesanan</text>
    <rect x="290" y="515" width="65" height="24" rx="12" fill="#FEF3C7"/>
    <text x="305" y="531" fill="#78350F" font-family="sans-serif" font-size="10" font-weight="bold">BARU</text>

    
    <!-- Mobile Floating Action Button (FAB) -->
    <circle cx="330" cy="710" r="28" fill="#5B4BDB"/>
    <line x1="330" y1="698" x2="330" y2="722" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="318" y1="710" x2="342" y2="710" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Bottom Navigation Bar (5 tabs) -->
    <rect x="0" y="760" width="390" height="84" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Tab 1 -->
    <rect x="20" y="772" width="24" height="20" rx="4" fill="#5B4BDB"/>
    <text x="14" y="806" fill="#5B4BDB" font-family="sans-serif" font-size="10" font-weight="bold">Beranda</text>
    <!-- Tab 2 -->
    <circle cx="115" cy="782" r="9" fill="#94A3B8"/>
    <text x="96" y="806" fill="#64748B" font-family="sans-serif" font-size="10">Pelanggan</text>
    <!-- Tab 3 -->
    <rect x="190" y="774" width="18" height="16" rx="2" fill="#94A3B8"/>
    <text x="183" y="806" fill="#64748B" font-family="sans-serif" font-size="10">Pesanan</text>
    <!-- Tab 4 -->
    <circle cx="275" cy="782" r="9" fill="#94A3B8"/>
    <text x="262" y="806" fill="#64748B" font-family="sans-serif" font-size="10">Produk</text>
    <!-- Tab 5 -->
    <line x1="345" y1="777" x2="365" y2="777" stroke="#94A3B8" stroke-width="2"/>
    <line x1="345" y1="782" x2="365" y2="782" stroke="#94A3B8" stroke-width="2"/>
    <line x1="345" y1="787" x2="365" y2="787" stroke="#94A3B8" stroke-width="2"/>
    <text x="343" y="806" fill="#64748B" font-family="sans-serif" font-size="10">Lainnya</text>
    
  </svg>